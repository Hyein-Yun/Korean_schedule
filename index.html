<!-- IHFB 강사 지문 일정 관리 (최종본) -->
<meta charset="utf-8">
<style>
  :root{
    --bg:#f7f6f2; --surface:#ffffff; --line:#e3e1d8; --line2:#cfcdc2;
    --text:#2c2c2a; --muted:#6b6a64; --hint:#9a988e;
    --accent:#185fa5; --accent-bg:#e6f1fb;
    --ok:#0f6e56; --warn:#854f0b; --danger:#a32d2d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  header h1{font-size:18px;font-weight:600;margin:0;}
  .sync-pill{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--hint);}
  .dot.on{background:var(--ok);}
  .dot.err{background:var(--danger);}
  .spacer{flex:1;}
  .btn{padding:7px 14px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;color:var(--text);font-size:13px;}
  .btn:hover{background:var(--bg);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{opacity:.92;}
  .btn.sm{padding:4px 9px;font-size:12px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);}
  label.fld input,label.fld select{padding:7px 9px;border:1px solid var(--line2);border-radius:7px;background:#fff;min-width:120px;}
  .tabs{display:flex;gap:4px;margin-bottom:14px;}
  .tab{padding:8px 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:14px;}
  .tab.active{background:var(--surface);border-color:var(--line);color:var(--text);font-weight:600;}
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .week-nav .label{font-weight:600;font-size:15px;}
  .lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .lane-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .lane-name{font-weight:600;font-size:15px;min-width:90px;}
  .gauge-wrap{flex:1;min-width:200px;max-width:340px;}
  .gauge-track{height:9px;border-radius:6px;background:var(--bg);overflow:hidden;}
  .gauge-fill{height:100%;border-radius:6px;transition:width .25s;}
  .gauge-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .room-badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .lane-body{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;min-height:20px;}
  .empty-lane{color:var(--hint);font-size:13px;padding:2px;}
  .card{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;background:#fff;min-width:170px;max-width:230px;}
  .card .lec{font-size:13px;font-weight:600;margin-bottom:3px;word-break:keep-all;}
  .card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .pill{font-size:11px;padding:1px 7px;border-radius:6px;}
  .card-actions{display:flex;gap:6px;margin-top:7px;}
  .card-actions button{flex:1;padding:3px;font-size:11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);}
  .card-actions button:hover{background:var(--bg);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0;}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;}
  .cal-cell.today{border-color:var(--accent);background:var(--accent-bg);}
  .cal-cell.dim{opacity:.45;}
  .cal-cell .cal-date{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .cal-cell.sat .cal-date{color:#185fa5;}
  .cal-cell.sun .cal-date,.cal-cell.holiday .cal-date{color:#a32d2d;font-weight:600;}
  .cal-holiday{font-size:10px;color:#a32d2d;font-weight:600;margin-bottom:3px;line-height:1.2;}
  .cal-item{font-size:11px;padding:2px 5px;border-radius:5px;margin-bottom:3px;background:var(--bg);border-left:3px solid var(--accent);word-break:keep-all;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
  .modal{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal .fld{margin-bottom:11px;width:100%;}
  .modal .fld input,.modal .fld select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .stat .l{font-size:12px;color:var(--muted);}
  .stat .v{font-size:22px;font-weight:600;}
  .help{font-size:12px;color:var(--muted);line-height:1.6;}
  code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px;}
  .hidden{display:none;}
  @media(max-width:560px){.card{max-width:none;}}
</style>

<div class="wrap">
  <header>
    <h1>강사 지문 일정 관리</h1>
    <div class="sync-pill"><span class="dot" id="syncDot"></span><span id="syncText">로컬 저장</span></div>
    <div class="spacer"></div>
    <button class="btn sm" id="settingsBtn">⚙ 연동·설정</button>
    <button class="btn primary sm" id="addBtn">+ 작업 추가</button>
  </header>

  <div class="stat-grid" id="statGrid"></div>

  <div class="tabs">
    <button class="tab active" data-view="board">강사별 레인 보드</button>
    <button class="tab" data-view="calendar">마감일 캘린더</button>
    <button class="tab" data-view="instructors">강사 관리</button>
  </div>

  <div id="view-board">
    <div class="week-nav">
      <button class="btn sm" id="prevWeek">‹ 이전 주</button>
      <span class="label" id="weekLabel"></span>
      <button class="btn sm" id="nextWeek">다음 주 ›</button>
      <button class="btn sm" id="thisWeek">이번 주</button>
      <div class="spacer"></div>
      <label class="fld" style="flex-direction:row;align-items:center;gap:6px;">
        <input type="checkbox" id="prepOnly" style="width:16px;height:16px;cursor:pointer;">
        <span>배정 준비만 보기</span>
      </label>
      <label class="fld" style="flex-direction:row;align-items:center;gap:6px;">
        <span>배정 담당자</span>
        <select id="assignerFilter" style="padding:6px 8px;border:1px solid var(--line2);border-radius:7px;"><option value="all">전체</option></select>
      </label>
    </div>
    <div id="lanes"></div>
    <div id="instrDetail" class="hidden"></div>
  </div>

  <div id="view-calendar" class="hidden">
    <div class="week-nav">
      <button class="btn sm" id="prevMonth">‹</button>
      <span class="label" id="monthLabel"></span>
      <button class="btn sm" id="nextMonth">›</button>
      <button class="btn sm" id="thisMonth">이번 달</button>
    </div>
    <div class="cal" id="calHead"></div>
    <div class="cal" id="calGrid" style="margin-top:6px;"></div>
  </div>

  <div id="view-instructors" class="hidden">
    <div class="panel">
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="newInstr" placeholder="강사 이름" style="padding:7px 9px;border:1px solid var(--line2);border-radius:7px;">
        <button class="btn primary sm" id="addInstrBtn">강사 추가</button>
      </div>
      <div id="instrList"></div>
    </div>
    <div class="panel" id="orphanPanel" style="display:none;">
      <div style="font-weight:600;margin-bottom:4px;color:var(--danger);">주인 없는 작업</div>
      <div class="help" style="margin-bottom:10px;">소속 강사가 삭제되어 보드에 안 보이는 작업입니다. 강사를 다시 추가하거나, 아래에서 다른 강사로 옮기세요.</div>
      <div id="orphanList"></div>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="taskModal">
  <div class="modal">
    <h3 id="modalTitle">작업 추가</h3>
    <label class="fld"><span>강의명</span><input type="text" id="m_lec" placeholder="예: 수능특강 영어 3강"></label>
    <label class="fld"><span>강사</span><select id="m_instr"></select></label>
    <label class="fld"><span>배정 담당자 (나)</span><input type="text" id="m_assigner" placeholder="배정한 사람 이름"></label>
    <div class="row">
      <label class="fld" style="flex:1;"><span>지문 수</span><input type="number" id="m_count" min="1" value="1"></label>
      <label class="fld" style="flex:1;"><span>배정일(시작)</span><input type="date" id="m_start"></label>
      <label class="fld" style="flex:1;"><span>마감일</span><input type="date" id="m_due"></label>
    </div>
    <label class="fld"><span>상태</span>
      <select id="m_status">
        <option value="prep">배정 준비</option>
        <option value="todo">요청함</option>
        <option value="doing">작업중</option>
        <option value="done">완료</option>
      </select>
    </label>
    <label class="fld"><span>메모 (선택)</span><input type="text" id="m_note" placeholder="추가 지문, 특이사항 등"></label>
    <div class="modal-actions">
      <button class="btn" id="m_cancel">취소</button>
      <button class="btn primary" id="m_save">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="setModal">
  <div class="modal">
    <h3>연동 · 데이터</h3>
    <p class="help">구글 시트 실시간 공유를 켜려면 아래에 Apps Script 웹앱 URL을 넣으세요.</p>
    <label class="fld" style="width:100%;margin-bottom:6px;"><span>웹앱 URL</span><input type="text" id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn sm primary" id="saveUrl">URL 저장</button>
      <button class="btn sm" id="pullBtn">시트에서 불러오기</button>
      <button class="btn sm" id="pushBtn">시트로 올리기</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:6px 0 14px;">
    <p class="help" style="margin-bottom:6px;">연동 없이 쓸 때: CSV로 백업·공유</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn sm" id="exportBtn">CSV 내보내기</button>
      <label class="btn sm" style="margin:0;">CSV 불러오기<input type="file" id="importFile" accept=".csv" class="hidden"></label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="set_close">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var LS_DATA='ihfb_sched_data', LS_URL='ihfb_sched_url', LS_CAP='ihfb_sched_cap';
  var state={instructors:[],tasks:[],cap:20};
  var url=localStorage.getItem(LS_URL)||'';
  var weekOffset=0, monthOffset=0, editingId=null, editingBaseMod=0;
  var lastAssigner=localStorage.getItem('ihfb_last_assigner')||'';

  var STATUS={prep:{label:'배정 준비',color:'#5f5e5a',bg:'#f1efe8'},todo:{label:'요청함',color:'#185fa5',bg:'#e6f1fb'},doing:{label:'작업중',color:'#854f0b',bg:'#faeeda'},done:{label:'완료',color:'#0f6e56',bg:'#e1f5ee'}};

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function $(id){return document.getElementById(id);}
  function startOfDay(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
  function startOfWeek(d){var x=startOfDay(d);var g=x.getDay();x.setDate(x.getDate()-g);return x;}
  function fmtMD(d){return (d.getMonth()+1)+'/'+d.getDate();}
  function daysFromToday(dueIso){ // 오늘 기준 며칠 후(양수=미래, 0=오늘, 음수=지남)
    var d=startOfDay(new Date(dueIso)),today=startOfDay(new Date());
    return Math.round((d-today)/86400000);
  }
  function ddayLabel(diff){ // D-day 짧은 표기
    if(diff<0)return 'D+'+Math.abs(diff);
    if(diff===0)return 'D-day';
    return 'D-'+diff;
  }
  function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function saveLocal(){localStorage.setItem(LS_DATA,JSON.stringify(state));}
  function loadLocal(){
    try{var d=JSON.parse(localStorage.getItem(LS_DATA));if(d){state=d;}}catch(e){}
    if(!state.instructors||!state.instructors.length){state.instructors=['김','이','박'];}
    if(!state.tasks)state.tasks=[];
    var c=localStorage.getItem(LS_CAP); if(c)state.cap=parseInt(c,10);
    if(!state.cap)state.cap=20;
  }

  function setSync(status,text){
    var dot=$('syncDot');dot.className='dot'+(status==='on'?' on':status==='err'?' err':'');
    $('syncText').textContent=text;
  }

  /* ---------- sheet sync (행 단위, 충돌 방지) ---------- */
  var pollTimer=null;
  var pendingPush={};
  var PROTECT_MS=12000;

  function api(action,payload){
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({action:action},payload||{}))
    }).then(function(r){return r.json();});
  }
  function startPolling(){
    if(pollTimer)clearInterval(pollTimer);
    if(!url)return;
    pollTimer=setInterval(function(){pullSheet(true);},15000);
  }
  function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

  function pushTask(t){
    t.lastModified=Date.now();
    pendingPush[t.id]=Date.now();
    saveLocal();
    if(!url)return;
    api('upsert',{task:t}).then(function(){setSync('on','시트 연동됨');}).catch(function(){setSync('err','저장 실패');});
  }
  function deleteRemote(id){
    pendingPush[id]=Date.now();
    saveLocal();
    if(!url)return;
    api('delete',{id:id}).then(function(){setSync('on','시트 연동됨');}).catch(function(){setSync('err','삭제 실패');});
  }
  function pushMeta(){
    saveLocal();
    if(!url)return;
    api('meta',{instructors:state.instructors,cap:state.cap}).then(function(){setSync('on','시트 연동됨');}).catch(function(){setSync('err','저장 실패');});
  }

  function mergeTasks(remote){
    var now=Date.now();
    var localById={};state.tasks.forEach(function(t){localById[t.id]=t;});
    var remoteById={};remote.forEach(function(t){remoteById[t.id]=t;});
    var ids={};Object.keys(localById).forEach(function(k){ids[k]=1;});Object.keys(remoteById).forEach(function(k){ids[k]=1;});
    var merged=[];
    Object.keys(ids).forEach(function(id){
      var l=localById[id],r=remoteById[id];
      var protectedNow=pendingPush[id]&&(now-pendingPush[id]<PROTECT_MS);
      if(l&&!r){
        if(protectedNow)merged.push(l);
      }else if(!l&&r){
        merged.push(r);
      }else if(l&&r){
        if(protectedNow){merged.push(l);}
        else{
          var lm=l.lastModified||0,rm=r.lastModified||0;
          merged.push(rm>=lm?r:l);
        }
      }
    });
    return merged;
  }

  function pullSheet(silent){
    if(!url){if(!silent)alert('웹앱 URL을 먼저 저장하세요.');return;}
    if(!silent)setSync('','불러오는 중…');
    fetch(url,{method:'GET'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.tasks){
          var now=Date.now();
          Object.keys(pendingPush).forEach(function(k){if(now-pendingPush[k]>=PROTECT_MS)delete pendingPush[k];});
          state.tasks=mergeTasks(d.tasks.map(function(t){return Object.assign({lastModified:0},t);}));
          if(d.instructors&&d.instructors.length)state.instructors=d.instructors;
          if(d.cap)state.cap=d.cap;
          saveLocal();
          if(!isTyping())renderAll();
        }
        setSync('on','시트 연동됨');
      })
      .catch(function(){setSync('err','연결 실패');});
  }
  function isTyping(){
    if(!$('taskModal').classList.contains('hidden'))return true;
    var a=document.activeElement;
    return a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA');
  }

  /* ---------- load calc ---------- */
  function weekStart(){var s=startOfWeek(new Date());s.setDate(s.getDate()+weekOffset*7);return s;}
  function tasksForInstructorWeek(name,ws){
    var we=new Date(ws);we.setDate(we.getDate()+7);
    return state.tasks.filter(function(t){
      if(t.instructor!==name)return false;
      if(t.status==='done')return false;
      if(!t.due)return true;
      var d=startOfDay(new Date(t.due));
      return d>=ws&&d<we;
    });
  }
  function loadOf(name,ws){
    return tasksForInstructorWeek(name,ws).reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);
  }

  /* ---------- render: stats ---------- */
  function renderStats(){
    var total=state.tasks.length;
    var done=state.tasks.filter(function(t){return t.status==='done';}).length;
    var prep=state.tasks.filter(function(t){return t.status==='prep';}).length;
    var openPassages=state.tasks.filter(function(t){return t.status!=='done';}).reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);
    $('statGrid').innerHTML=stat('전체 작업',total)+stat('배정 준비',prep)+stat('완료',done)+stat('남은 지문 수',openPassages);
  }
  function stat(l,v){return '<div class="stat"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}

  /* ---------- render: board ---------- */
  function renderBoard(){
    var ws=weekStart();
    var we=new Date(ws);we.setDate(we.getDate()+6);
    $('weekLabel').textContent=fmtMD(ws)+' ~ '+fmtMD(we)+(weekOffset===0?' (이번 주)':'');
    fillAssignerFilter();
    var af=$('assignerFilter').value;
    var prepOnly=$('prepOnly').checked;
    var lanes=$('lanes');lanes.innerHTML='';
    if(!state.instructors.length){lanes.innerHTML='<div class="panel help">강사 관리 탭에서 강사를 추가하세요.</div>';return;}
    state.instructors.forEach(function(name){
      var allActive=state.tasks.filter(function(t){
        if(t.instructor!==name)return false;
        if(af!=='all'&&t.assigner!==af)return false;
        if(prepOnly)return t.status==='prep';
        return t.status==='todo'||t.status==='doing'; // 배정 준비·완료 제외
      });
      allActive.sort(function(a,b){
        if(!a.due&&!b.due)return 0;
        if(!a.due)return 1;
        if(!b.due)return -1;
        return a.due<b.due?-1:1;
      });
      var cards=allActive.map(function(t){return taskCard(t);}).join('');
      if(!cards){
        var emptyMsg=prepOnly?'배정 준비 작업 없음':(af==='all'?'진행중 작업 없음':'해당 담당자 배정 작업 없음');
        cards='<div class="empty-lane">'+emptyMsg+'</div>';
      }
      var totalP=allActive.reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);

      // 잡혀 있는 마감일들을 나열 (가까운 순) + 오늘 기준 D-day
      var today=startOfDay(new Date()).getTime();
      var withDue=allActive.filter(function(t){return t.due;}); // allActive는 이미 마감일순 정렬됨
      var noDueCnt=allActive.length-withDue.length;
      var overdueCnt=0;
      var dueChips=withDue.map(function(t){
        var diff=daysFromToday(t.due);
        var cc='#6b6a64',cbg='#f1efe8';
        if(diff<0){cc='#a32d2d';cbg='#fcebeb';overdueCnt++;}

  var detailInstr=null, detailFrom='', detailTo='';
  function openInstrDetail(name){
    detailInstr=name;
    $('lanes').classList.add('hidden');
    document.querySelector('.week-nav').classList.add('hidden');
    $('statGrid').classList.add('hidden');
    document.querySelector('.tabs').classList.add('hidden');
    var box=$('instrDetail');box.classList.remove('hidden');
    var mine=state.tasks.filter(function(t){return t.instructor===name;});
    var active=mine.filter(function(t){return t.status!=='done';});
    var doneAll=mine.filter(function(t){return t.status==='done';});
    var activeP=active.reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);

    // 기간 필터 (배정일 기준)
    function inRange(t){
      if(!detailFrom&&!detailTo)return true;
      if(!t.start)return false;
      var s=startOfDay(new Date(t.start)).getTime();
      if(detailFrom&&s<startOfDay(new Date(detailFrom)).getTime())return false;
      if(detailTo&&s>startOfDay(new Date(detailTo)).getTime())return false;
      return true;
    }
    var done=doneAll.filter(inRange);
    var doneP=done.reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);
    var doneAllP=doneAll.reduce(function(s,t){return s+(parseInt(t.count,10)||0);},0);

    active.sort(function(a,b){if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:1;});
    done.sort(function(a,b){return (b.start||'')<(a.start||'')?-1:1;});
    var initial=name.charAt(0);
    var rangeLabel=(detailFrom||detailTo)?((detailFrom||'처음')+' ~ '+(detailTo||'현재')+' 배정분'):'전체 기간';

      '<div style="background:#1d2433;color:#fff;padding:20px 22px;display:flex;align-items:center;gap:14px;">'+
        '<div style="width:46px;height:46px;border-radius:50%;background:#534ab7;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;">'+esc(initial)+'</div>'+
        '<div><div style="font-size:20px;font-weight:700;">'+esc(name)+' 강사</div>'+
        '<div style="font-size:13px;opacity:.8;margin-top:2px;">진행중 '+active.length+'건 · '+activeP+'지문  /  완료 누적(전체) '+doneAll.length+'건 · '+doneAllP+'지문</div></div>'+
      '</div>'+
      '<div style="padding:18px 22px;background:#f7f6f2;">'+
        '<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;">'+
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'+
            '<span style="font-weight:600;">기간별 촬영 지문 (배정일 기준)</span>'+
            '<input type="date" id="dFrom" value="'+esc(detailFrom)+'" style="padding:5px 8px;border:1px solid var(--line2);border-radius:6px;">'+
            '<span>~</span>'+
            '<input type="date" id="dTo" value="'+esc(detailTo)+'" style="padding:5px 8px;border:1px solid var(--line2);border-radius:6px;">'+
            '<button class="btn sm" id="dClear">전체</button>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--muted);margin-bottom:4px;">'+esc(rangeLabel)+'</div>'+
          '<div style="font-size:26px;font-weight:700;color:#534ab7;">'+doneP+'지문 <span style="font-size:14px;font-weight:400;color:var(--muted);">완료 ('+done.length+'건)</span></div>'+
        '</div>'+

        '<div style="font-weight:600;font-size:15px;margin:20px 0 10px;color:var(--muted);">완료 '+(detailFrom||detailTo?'(이 기간 '+done.length+'건)':'(전체 '+done.length+'건)')+'</div>'+

  /* ---------- 강사 상세: 간트 타임라인 ---------- */
  function renderGantt(tasks){
    // start+due 둘 다 있는 작업만 막대로 표현 가능
    var bars=tasks.filter(function(t){return t.start&&t.due;});
    if(!bars.length){
      return '<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--hint);font-size:13px;">기간(배정일~마감일)이 있는 작업이 없어 타임라인을 그릴 수 없어요. 배정일과 마감일이 모두 입력된 작업만 막대로 표시됩니다.</div>';
    }
    // 전체 표시 범위: 가장 이른 배정일 ~ 가장 늦은 마감일 (양쪽 1일 여백)
    var minT=Infinity,maxT=-Infinity;
    bars.forEach(function(t){
      var s=startOfDay(new Date(t.start)).getTime(),e=startOfDay(new Date(t.due)).getTime();
      if(s<minT)minT=s;if(e>maxT)maxT=e;
    });
    var dayMs=86400000;
    var startDay=new Date(minT-dayMs), endDay=new Date(maxT+dayMs);
    var totalDays=Math.round((endDay-startDay)/dayMs)+1;
    if(totalDays<1)totalDays=1;
    var todayT=startOfDay(new Date()).getTime();

    // 마감일 가까운 순으로 행 정렬
    bars.sort(function(a,b){return a.due<b.due?-1:(a.due>b.due?1:0);});

    // 날짜 눈금: 일요일/월요일 기준 주 단위로 라벨, 너무 빽빽하면 간격 조정
    var labelEvery=1;
    if(totalDays>21)labelEvery=7; else if(totalDays>10)labelEvery=2;

    var colW=Math.max(100/totalDays,0); // %
    // 헤더 눈금
    var ticks='';
    for(var i=0;i<totalDays;i++){
      var cur=new Date(startDay.getTime()+i*dayMs);
      var isToday=startOfDay(cur).getTime()===todayT;
      var dow=cur.getDay();
      var showLabel=(i%labelEvery===0)||isToday;
      var labelColor=dow===0?'#a32d2d':dow===6?'#185fa5':'#9a988e';
      ticks+='<div style="flex:1;min-width:0;text-align:center;font-size:10px;color:'+(isToday?'#fff':labelColor)+';'+
        (isToday?'background:#534ab7;border-radius:4px;font-weight:700;':'')+
        'padding:2px 0;border-left:1px solid '+(isToday?'transparent':'#f0eee7')+';">'+
        (showLabel?(cur.getMonth()+1)+'/'+cur.getDate():'')+'</div>';
    }

    // 작업 막대 행들
    var rows=bars.map(function(t){
      var s=startOfDay(new Date(t.start)).getTime(),e=startOfDay(new Date(t.due)).getTime();
      var offsetDays=Math.round((s-startDay.getTime())/dayMs);
      var spanDays=Math.round((e-s)/dayMs)+1;
      var leftPct=offsetDays/totalDays*100;
      var widthPct=spanDays/totalDays*100;
      var st=STATUS[t.status]||STATUS.todo;
      var done=t.status==='done';
      var overdue=!done&&e<todayT;
      // 막대 색: 완료=초록계열 옅게, 진행=상태색, 마감지남=빨강
      var barBg,barText='#fff';
      if(done){barBg='#9fcab9';barText='#0f4233';}
      else if(overdue){barBg='#d9534f';}
      else if(t.status==='doing'){barBg='#d98a2b';}
      else if(t.status==='todo'){barBg='#3b82c4';}
      else{barBg='#9a988e';} // prep 등
      var label=esc(t.lecture||'(강의명 없음)')+' · '+(t.count||0)+'지문';
      return '<div style="display:flex;align-items:center;height:30px;margin-bottom:5px;">'+
        '<div style="position:relative;flex:1;height:100%;">'+
          '<div title="'+label+' ('+fmtMD(new Date(s))+'~'+fmtMD(new Date(e))+')" '+
            'style="position:absolute;left:'+leftPct+'%;width:'+widthPct+'%;top:3px;height:24px;background:'+barBg+';color:'+barText+';border-radius:5px;font-size:11px;font-weight:600;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap;'+(done?'opacity:.85;':'')+'">'+
            label+'</div>'+
        '</div>'+
      '</div>';
    }).join('');

    // 오늘 세로선 (범위 안에 있을 때만)
    var todayLine='';
    if(todayT>=startDay.getTime()&&todayT<=endDay.getTime()){
      var todayOffset=Math.round((todayT-startDay.getTime())/dayMs);
      var todayPct=(todayOffset+0.5)/totalDays*100;
      todayLine='<div style="position:absolute;left:'+todayPct+'%;top:0;bottom:0;width:2px;background:#534ab7;opacity:.5;z-index:1;"></div>';
    }

    return '<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;overflow-x:auto;">'+
      '<div style="font-weight:600;margin-bottom:10px;">촬영 기간 타임라인 <span style="font-size:12px;color:var(--muted);font-weight:400;">(배정일~마감일, 막대 = 강의·지문 수)</span></div>'+
      '<div style="min-width:520px;">'+
        '<div style="display:flex;margin-bottom:8px;">'+ticks+'</div>'+
        '<div style="position:relative;">'+todayLine+rows+'</div>'+
        '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);">'+
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b82c4;vertical-align:middle;margin-right:4px;"></span>요청함</span>'+
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#d98a2b;vertical-align:middle;margin-right:4px;"></span>작업중</span>'+
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#9fcab9;vertical-align:middle;margin-right:4px;"></span>완료</span>'+
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#d9534f;vertical-align:middle;margin-right:4px;"></span>마감 지남</span>'+
          '<span><span style="display:inline-block;width:10px;height:2px;background:#534ab7;vertical-align:middle;margin-right:4px;"></span>오늘</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function taskCard(t){
    var st=STATUS[t.status]||STATUS.todo;
    // 마감일 배지 (카드에서 가장 강조되는 요소)
    var dueBadge='';
    var overdue=false;
    if(t.due){
      var diff=daysFromToday(t.due);
      var dc='#0f6e56',dbg='#e1f5ee'; // 기본: 여유(초록)
      if(diff<0){dc='#a32d2d';dbg='#fcebeb';overdue=true;}        // 지남: 빨강
      else if(diff<=1){dc='#a32d2d';dbg='#fcebeb';}               // 오늘/내일: 빨강
      else if(diff<=3){dc='#854f0b';dbg='#faeeda';}               // 임박: 주황
      dueBadge='<span style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:7px;background:'+dbg+';color:'+dc+';white-space:nowrap;">'+
        fmtMD(startOfDay(new Date(t.due)))+' <span style="font-size:11px;font-weight:600;opacity:.85;">'+ddayLabel(diff)+'</span></span>';
    }else{
      dueBadge='<span style="font-size:12px;color:#9a988e;white-space:nowrap;">마감 미정</span>';
    }
    var cardBg=overdue&&t.status!=='done'?'background:#fcebeb;':'background:#fff;';
    var prepStyle=t.status==='prep'?'border-style:dashed;border-left-style:solid;':'';
    // 기간·하루치 계산
    var paceHtml='';
    if(t.start&&t.due){
      var s=startOfDay(new Date(t.start)),e=startOfDay(new Date(t.due));
      var days=Math.round((e-s)/86400000)+1; // 양 끝 포함
      if(days>=1){
        var perDay=(parseInt(t.count,10)||0)/days;
        var pd=Math.round(perDay*10)/10;
        var pcolor,pbg;
        if(perDay<=1.5){pcolor='#0f6e56';pbg='#e1f5ee';}
        else if(perDay<=2.5){pcolor='#854f0b';pbg='#faeeda';}
        else{pcolor='#a32d2d';pbg='#fcebeb';}
        paceHtml='<div class="meta" style="margin-top:4px;"><span style="font-size:11px;padding:2px 8px;border-radius:6px;background:'+pbg+';color:'+pcolor+';font-weight:600;">기간 '+days+'일 · 하루 '+pd+'지문</span></div>';
      }
    } else if(t.start){
      paceHtml='<div class="meta" style="margin-top:4px;"><span style="font-size:11px;color:#6b6a64;">배정 '+fmtMD(startOfDay(new Date(t.start)))+' (마감일 미정)</span></div>';
    }
    return '<div class="card" style="border-left-color:'+st.color+';'+cardBg+prepStyle+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;">'+
        '<div class="lec" style="margin-bottom:0;">'+esc(t.lecture||'(강의명 없음)')+'</div>'+
        dueBadge+
      '</div>'+
      '<div class="meta">'+
        '<span style="font-size:11px;color:'+st.color+';font-weight:600;">'+st.label+'</span>'+
        '<span>지문 '+(t.count||0)+'</span>'+
        (t.assigner?'<span style="font-size:11px;color:#534ab7;">배정: '+esc(t.assigner)+'</span>':'')+
      '</div>'+
      paceHtml+
      (t.note?'<div class="meta" style="margin-top:3px;">'+esc(t.note)+'</div>':'')+
      '<div class="card-actions">'+
        '<button data-act="edit" data-id="'+t.id+'">수정</button>'+
        (t.status!=='done'?'<button data-act="done" data-id="'+t.id+'">완료</button>':'<button data-act="reopen" data-id="'+t.id+'">되돌리기</button>')+
        '<button data-act="del" data-id="'+t.id+'">삭제</button>'+
      '</div>'+
    '</div>';
  }

  /* ---------- render: calendar ---------- */
  var DOW=['일','월','화','수','목','금','토'];
  function renderCalendar(){
    $('calHead').innerHTML=DOW.map(function(d,i){
      var c=i===0?'color:#a32d2d;':i===6?'color:#185fa5;':'';
      return '<div class="cal-h" style="'+c+'">'+d+'</div>';
    }).join('');
    var base=new Date();base.setMonth(base.getMonth()+monthOffset);
    var y=base.getFullYear(),m=base.getMonth();
    $('monthLabel').textContent=y+'년 '+(m+1)+'월';
    var first=new Date(y,m,1);var startGrid=new Date(first);startGrid.setDate(1-first.getDay());
    var today=startOfDay(new Date());
    var grid=$('calGrid');grid.innerHTML='';
    for(var i=0;i<42;i++){
      var cur=new Date(startGrid);cur.setDate(startGrid.getDate()+i);
      var inMonth=cur.getMonth()===m;
      var iso=isoDate(cur);
      var dow=cur.getDay();
      var holiday=HOLIDAYS[iso];
      var dayTasks=state.tasks.filter(function(t){return t.due===iso&&t.status!=='done';});
      var cls='cal-cell';
      if(+startOfDay(cur)===+today)cls+=' today';
      if(!inMonth)cls+=' dim';
      if(holiday)cls+=' holiday';
      else if(dow===0)cls+=' sun';
      else if(dow===6)cls+=' sat';
      var items=dayTasks.map(function(t){
        var st=STATUS[t.status]||STATUS.todo;
        return '<div class="cal-item" style="border-left-color:'+st.color+';" title="'+esc(t.instructor)+' · '+esc(t.lecture)+'">'+esc(t.instructor)+' '+esc(t.lecture||'')+' ('+(t.count||0)+')</div>';
      }).join('');
      var cell=document.createElement('div');
      cell.className=cls;
      cell.innerHTML='<div class="cal-date">'+cur.getDate()+'</div>'+
        (holiday?'<div class="cal-holiday" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')+items;
      grid.appendChild(cell);
      if(i>=35&&cur.getMonth()!==m&&i%7===0)break;
    }
  }

  /* ---------- render: instructors ---------- */
  function renderInstructors(){
    var box=$('instrList');box.innerHTML='';
    if(!state.instructors.length){box.innerHTML='<div class="help">등록된 강사가 없습니다.</div>';}
    state.instructors.forEach(function(name,i){
      var active=state.tasks.filter(function(t){return t.instructor===name&&t.status!=='done';}).length;
      var row=document.createElement('div');
      row.className='row';
      row.style.cssText='justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;';
      row.innerHTML='<span style="font-weight:600;flex:1;">'+esc(name)+' <span style="color:var(--muted);font-weight:400;font-size:12px;">진행중 '+active+'건</span></span>'+
        '<button class="btn sm" data-instr-rename="'+i+'">이름 수정</button>'+
        '<button class="btn sm" data-instr-del="'+i+'">삭제</button>';
      box.appendChild(row);
    });
    renderOrphans();
  }
  function renderOrphans(){
    var panel=$('orphanPanel'),box=$('orphanList');
    var orphans=state.tasks.filter(function(t){return state.instructors.indexOf(t.instructor)<0;});
    if(!orphans.length){panel.style.display='none';return;}
    panel.style.display='';box.innerHTML='';
    orphans.forEach(function(t){
      var opts=state.instructors.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
      var row=document.createElement('div');
      row.className='row';
      row.style.cssText='justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;';
      row.innerHTML='<span style="flex:1;min-width:160px;"><b>'+esc(t.lecture||'(강의명 없음)')+'</b> <span style="color:var(--muted);font-size:12px;">지문 '+(t.count||0)+' · 이전 강사: '+esc(t.instructor)+'</span></span>'+
        (state.instructors.length?'<select data-orphan-to="'+t.id+'" style="padding:6px 8px;border:1px solid var(--line2);border-radius:7px;">'+opts+'</select><button class="btn sm primary" data-orphan-move="'+t.id+'">옮기기</button>':'<span class="help">먼저 강사를 추가하세요</span>')+
        '<button class="btn sm" data-orphan-del="'+t.id+'">삭제</button>';
      box.appendChild(row);
    });
  }

  function fillInstrSelect(){
    $('m_instr').innerHTML=state.instructors.map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
  }
  function renderAll(){renderStats();renderBoard();renderCalendar();renderInstructors();fillInstrSelect();}

  /* ---------- modal ---------- */
  function openTask(id){
    editingId=id||null;
    fillInstrSelect();
    if(id){
      var t=state.tasks.filter(function(x){return x.id===id;})[0];
      editingBaseMod=t.lastModified||0;
      $('modalTitle').textContent='작업 수정';
      $('m_lec').value=t.lecture||'';$('m_instr').value=t.instructor;$('m_assigner').value=t.assigner||'';$('m_count').value=t.count||1;
      $('m_start').value=t.start||'';$('m_due').value=t.due||'';$('m_status').value=t.status;$('m_note').value=t.note||'';
    }else{
      editingBaseMod=0;
      $('modalTitle').textContent='작업 추가';
      $('m_lec').value='';$('m_assigner').value=lastAssigner;$('m_count').value=1;$('m_start').value='';$('m_due').value='';$('m_status').value='todo';$('m_note').value='';
    }
    $('taskModal').classList.remove('hidden');
  }
  function saveTask(){
    var lec=$('m_lec').value.trim();
    if(!lec){alert('강의명을 입력하세요.');return;}
    var stat=$('m_status').value;
    if((stat==='todo'||stat==='doing')&&(!$('m_start').value||!$('m_due').value)){
      alert("'"+(STATUS[stat].label)+"' 상태는 강사에게 실제 배정한 단계예요.\n배정일과 마감일을 모두 입력해 주세요.\n\n(아직 계획 단계라면 상태를 '배정 준비'로 두면 날짜 없이 저장됩니다.)");
      return;
    }
    var data={lecture:lec,instructor:$('m_instr').value,assigner:$('m_assigner').value.trim(),count:parseInt($('m_count').value,10)||1,start:$('m_start').value||null,due:$('m_due').value||null,status:stat,note:$('m_note').value.trim()};
    if(data.assigner){lastAssigner=data.assigner;localStorage.setItem('ihfb_last_assigner',lastAssigner);}

    function commit(){
      if(editingId){
        state.tasks=state.tasks.map(function(t){return t.id===editingId?Object.assign(t,data):t;});
      }else{
        data.id=uid();state.tasks.push(data);
      }
      var saved=state.tasks.filter(function(t){return t.id===(editingId||data.id);})[0];
      $('taskModal').classList.add('hidden');
      pushTask(saved);renderAll();
      if(detailInstr)openInstrDetail(detailInstr);
    }

    if(editingId&&url){
      var btn=$('m_save');btn.disabled=true;btn.textContent='확인 중…';
      api('getone',{id:editingId}).then(function(res){
        btn.disabled=false;btn.textContent='저장';
        var remoteMod=res&&res.task?(res.task.lastModified||0):0;
        if(res&&res.task&&remoteMod>editingBaseMod){
          var r=res.task;
          var msg='다른 사람이 방금 이 작업을 수정했습니다.\n\n[상대가 저장한 내용]\n강의: '+(r.lecture||'')+'\n강사: '+(r.instructor||'')+'\n지문: '+(r.count||0)+' / 마감: '+(r.due||'없음')+' / 상태: '+(STATUS[r.status]?STATUS[r.status].label:r.status)+'\n\n확인=내 내용으로 덮어쓰기, 취소=상대 내용 유지(내 수정 버림)';
          if(confirm(msg)){commit();}
          else{
            state.tasks=state.tasks.map(function(t){return t.id===editingId?Object.assign(t,r):t;});
            $('taskModal').classList.add('hidden');renderAll();
          }
        }else{commit();}
      }).catch(function(){
        btn.disabled=false;btn.textContent='저장';commit();
      });
    }else{commit();}
  }

  /* ---------- CSV ---------- */
  function exportCSV(){
    var rows=[['id','lecture','instructor','count','due','status','note']];
    state.tasks.forEach(function(t){rows.push([t.id,t.lecture,t.instructor,t.count,t.due||'',t.status,t.note||'']);});
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='강사일정_'+isoDate(new Date())+'.csv';a.click();
  }
  function importCSV(file){
    var rd=new FileReader();
    rd.onload=function(){
      var lines=rd.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(function(l){return l.trim();});
      var hdr=parseCsvLine(lines[0]);
      var idx={};hdr.forEach(function(h,i){idx[h.trim()]=i;});
      var imported=[];
      for(var i=1;i<lines.length;i++){
        var c=parseCsvLine(lines[i]);
        imported.push({id:c[idx.id]||uid(),lecture:c[idx.lecture]||'',instructor:c[idx.instructor]||'',count:parseInt(c[idx.count],10)||1,due:c[idx.due]||null,status:c[idx.status]||'todo',note:c[idx.note]||''});
        var ins=c[idx.instructor];if(ins&&state.instructors.indexOf(ins)<0)state.instructors.push(ins);
      }
      state.tasks=imported;
      saveLocal();
      if(url){imported.forEach(function(t){pushTask(t);});pushMeta();}
      renderAll();
      alert(imported.length+'건 불러왔습니다.');
    };
    rd.readAsText(file);
  }
  function parseCsvLine(line){
    var out=[],cur='',q=false;
    for(var i=0;i<line.length;i++){var ch=line[i];
      if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
      else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}
    }
    out.push(cur);return out;
  }

  /* ---------- events ---------- */
  function cardClick(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var id=b.dataset.id,act=b.dataset.act;
    var t=state.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
    if(act==='edit')openTask(id);
    else if(act==='done'){t.status='done';pushTask(t);afterChange();}
    else if(act==='reopen'){t.status='doing';pushTask(t);afterChange();}
    else if(act==='del'){if(confirm('삭제할까요?')){state.tasks=state.tasks.filter(function(x){return x.id!==id;});deleteRemote(id);afterChange();}}
  }
  function afterChange(){
    renderAll();
    if(detailInstr)openInstrDetail(detailInstr);
  }

  function bind(){
    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
        tab.classList.add('active');
        var v=tab.dataset.view;
        ['board','calendar','instructors'].forEach(function(name){$('view-'+name).classList.toggle('hidden',name!==v);});
      });
    });
    $('addBtn').addEventListener('click',function(){openTask(null);});
    $('m_cancel').addEventListener('click',function(){$('taskModal').classList.add('hidden');});
    $('m_save').addEventListener('click',saveTask);
    $('taskModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
    $('lanes').addEventListener('click',function(e){
      var nameEl=e.target.closest('[data-instr-detail]');
      if(nameEl){openInstrDetail(nameEl.getAttribute('data-instr-detail'));return;}
      cardClick(e);
    });
    $('instrDetail').addEventListener('click',cardClick);

    $('prevWeek').addEventListener('click',function(){weekOffset--;renderBoard();});
    $('nextWeek').addEventListener('click',function(){weekOffset++;renderBoard();});
    $('thisWeek').addEventListener('click',function(){weekOffset=0;renderBoard();});
    $('assignerFilter').addEventListener('change',renderBoard);
    $('prepOnly').addEventListener('change',renderBoard);

    $('prevMonth').addEventListener('click',function(){monthOffset--;renderCalendar();});
    $('nextMonth').addEventListener('click',function(){monthOffset++;renderCalendar();});
    $('thisMonth').addEventListener('click',function(){monthOffset=0;renderCalendar();});

    $('addInstrBtn').addEventListener('click',function(){
      var n=$('newInstr').value.trim();if(!n)return;
      if(state.instructors.indexOf(n)<0)state.instructors.push(n);
      $('newInstr').value='';pushMeta();renderAll();
    });
    $('newInstr').addEventListener('keydown',function(e){if(e.key==='Enter')$('addInstrBtn').click();});

    $('instrList').addEventListener('click',function(e){
      var del=e.target.closest('[data-instr-del]');
      var ren=e.target.closest('[data-instr-rename]');
      if(del){
        var i=parseInt(del.dataset.instrDel,10);
        var nm=state.instructors[i];
        var cnt=state.tasks.filter(function(t){return t.instructor===nm;}).length;
        var msg='"'+nm+'" 강사를 삭제할까요?';
        if(cnt)msg+='\n\n이 강사 앞으로 작업 '+cnt+'건이 있습니다. 삭제하면 그 작업은 \'주인 없는 작업\'으로 아래에 남고, 다른 강사로 옮기거나 정리할 수 있습니다.';
        if(confirm(msg)){state.instructors.splice(i,1);pushMeta();renderAll();}
      }
      if(ren){
        var j=parseInt(ren.dataset.instrRename,10);
        var old=state.instructors[j];
        var nv=prompt('새 강사 이름을 입력하세요.',old);
        if(nv==null)return;
        nv=nv.trim();
        if(!nv){alert('이름을 입력하세요.');return;}
        if(nv!==old&&state.instructors.indexOf(nv)>=0){alert('이미 같은 이름의 강사가 있습니다.');return;}
        state.instructors[j]=nv;
        var moved=[];
        state.tasks.forEach(function(t){if(t.instructor===old){t.instructor=nv;moved.push(t);}});
        pushMeta();moved.forEach(function(t){pushTask(t);});renderAll();
      }
    });
    $('orphanList').addEventListener('click',function(e){
      var mv=e.target.closest('[data-orphan-move]');
      var dl=e.target.closest('[data-orphan-del]');
      if(mv){
        var id=mv.dataset.orphanMove;
        var sel=$('orphanList').querySelector('[data-orphan-to="'+id+'"]');
        var to=sel?sel.value:null;
        var t=state.tasks.filter(function(x){return x.id===id;})[0];
        if(t&&to){t.instructor=to;pushTask(t);renderAll();}
      }
      if(dl){
        var did=dl.dataset.orphanDel;
        if(confirm('이 작업을 삭제할까요?')){state.tasks=state.tasks.filter(function(x){return x.id!==did;});deleteRemote(did);renderAll();}
      }
    });

    $('settingsBtn').addEventListener('click',function(){$('sheetUrl').value=url;$('setModal').classList.remove('hidden');});
    $('set_close').addEventListener('click',function(){$('setModal').classList.add('hidden');});
    $('setModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
    $('saveUrl').addEventListener('click',function(){
      url=$('sheetUrl').value.trim();localStorage.setItem(LS_URL,url);
      if(url){setSync('on','시트 연동됨');pullSheet(false);startPolling();}else{setSync('','로컬 저장');stopPolling();}
    });
    $('pullBtn').addEventListener('click',function(){pullSheet(false);});
    $('pushBtn').addEventListener('click',function(){state.tasks.forEach(function(t){pushTask(t);});pushMeta();});
    $('exportBtn').addEventListener('click',exportCSV);
    $('importFile').addEventListener('change',function(){if(this.files[0])importCSV(this.files[0]);});
  }

  /* ---------- init ---------- */
  loadLocal();
  bind();
  if(url){setSync('on','시트 연동됨');pullSheet(true);startPolling();}else{setSync('','로컬 저장');}
  renderAll();
})();
</script>
